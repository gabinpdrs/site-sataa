<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Compteur FIFA</title>
<style>
  :root {
    --bg: #0b1220; --card: #141d30; --line: #24314d; --text: #e8edf7; --muted: #8a97b3;
    --accent: #22c55e; --lose: #ef4444; --draw: #eab308;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 8px 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  input, select, button { font: inherit; color: inherit; }
  input, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  button { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: #04120a; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  button.x { background: transparent; color: var(--muted); padding: 4px 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .row > button { flex: 0 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 12px; display: flex; align-items: center; gap: 2px; }
  .match { display: grid; grid-template-columns: 1fr 16px 1fr; gap: 8px; align-items: center; }
  .match .side { display: flex; flex-direction: column; gap: 8px; }
  .match input[type=number] { text-align: center; font-size: 1.6rem; font-weight: 700; padding: 8px 4px; }
  .match .sep { text-align: center; color: var(--muted); }
  .full { width: 100%; margin-top: 12px; }
  .msg { color: var(--lose); font-size: .9rem; min-height: 1.2em; margin-top: 8px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; white-space: nowrap; }
  th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; }
  td:first-child, th:first-child { text-align: left; }
  .w { color: var(--accent); } .l { color: var(--lose); } .d { color: var(--draw); }
  ul.history { list-style: none; margin: 0; padding: 0; }
  ul.history li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  ul.history .score { flex: 1; }
  ul.history .date { color: var(--muted); font-size: .8rem; }
  .win { font-weight: 700; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1>⚽ Compteur FIFA</h1>

  <section>
    <h2>Joueurs</h2>
    <form id="addPlayer" class="row">
      <input id="playerName" placeholder="Prénom" maxlength="20" autocomplete="off">
      <button type="submit">Ajouter</button>
    </form>
    <div id="players" class="chips"></div>
  </section>

  <section>
    <h2>Nouveau match</h2>
    <form id="addMatch">
      <div class="match">
        <div class="side">
          <select id="p1" aria-label="Joueur 1"></select>
          <input id="s1" type="number" min="0" inputmode="numeric" value="0" aria-label="Buts joueur 1">
        </div>
        <span class="sep">–</span>
        <div class="side">
          <select id="p2" aria-label="Joueur 2"></select>
          <input id="s2" type="number" min="0" inputmode="numeric" value="0" aria-label="Buts joueur 2">
        </div>
      </div>
      <button type="submit" class="full">Enregistrer le match</button>
      <div id="matchMsg" class="msg"></div>
    </form>
  </section>

  <section>
    <h2>Récap</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Joueur</th><th>MJ</th><th>V</th><th>N</th><th>D</th><th>BP</th><th>BC</th><th>Diff</th><th>% V</th><th>V/D</th></tr>
        </thead>
        <tbody id="recap"></tbody>
      </table>
    </div>
    <p class="muted">MJ = matchs joués · BP = buts pour · BC = buts contre · V/D = victoires ÷ défaites</p>
  </section>

  <section>
    <h2>Historique</h2>
    <ul id="history" class="history"></ul>
  </section>

  <section>
    <h2>Données</h2>
    <p class="muted">Les données sont enregistrées sur cet appareil. Exporte-les pour les sauvegarder ou les partager.</p>
    <div class="tools">
      <button type="button" class="ghost" id="exportBtn">Exporter</button>
      <button type="button" class="ghost" id="importBtn">Importer</button>
      <button type="button" class="ghost" id="resetBtn">Tout effacer</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </section>
</main>

<script>
const KEY = 'fifa-compteur-v1';
let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.players) && Array.isArray(s.matches)) return s;
  } catch (e) {}
  return { players: [], matches: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function stats() {
  const t = {};
  for (const p of state.players) t[p] = { mj: 0, v: 0, n: 0, d: 0, bp: 0, bc: 0 };
  for (const m of state.matches) {
    for (const [me, op, mine, theirs] of [[m.p1, m.p2, m.s1, m.s2], [m.p2, m.p1, m.s2, m.s1]]) {
      if (!t[me]) continue;
      const r = t[me];
      r.mj++; r.bp += mine; r.bc += theirs;
      if (mine > theirs) r.v++; else if (mine < theirs) r.d++; else r.n++;
    }
  }
  return Object.entries(t)
    .map(([name, r]) => ({ name, ...r, diff: r.bp - r.bc }))
    .sort((a, b) => b.v - a.v || b.diff - a.diff || b.bp - a.bp || a.name.localeCompare(b.name));
}

function render() {
  // Joueurs
  $('players').innerHTML = state.players.length
    ? state.players.map((p, i) => `<span class="chip">${esc(p)}<button class="x" data-del-player="${i}" aria-label="Supprimer ${esc(p)}">✕</button></span>`).join('')
    : '<span class="muted">Ajoute au moins deux prénoms pour commencer.</span>';

  // Sélecteurs
  for (const [id, def] of [['p1', 0], ['p2', 1]]) {
    const sel = $(id), prev = sel.value;
    sel.innerHTML = state.players.map(p => `<option>${esc(p)}</option>`).join('');
    sel.value = state.players.includes(prev) ? prev : (state.players[def] || '');
  }

  // Récap
  const rows = stats();
  $('recap').innerHTML = rows.length ? rows.map(r => {
    const pct = r.mj ? Math.round(r.v / r.mj * 100) + ' %' : '–';
    const ratio = r.d ? (r.v / r.d).toFixed(2) : (r.v ? '∞' : '–');
    return `<tr><td><b>${esc(r.name)}</b></td><td>${r.mj}</td><td class="w">${r.v}</td><td class="d">${r.n}</td><td class="l">${r.d}</td>
      <td>${r.bp}</td><td>${r.bc}</td><td>${r.diff > 0 ? '+' : ''}${r.diff}</td><td>${pct}</td><td>${ratio}</td></tr>`;
  }).join('') : '<tr><td colspan="10" class="muted">Aucun joueur.</td></tr>';

  // Historique (le plus récent en haut)
  $('history').innerHTML = state.matches.length ? state.matches.map((m, i) => ({ m, i })).reverse().map(({ m, i }) => {
    const c1 = m.s1 > m.s2 ? 'win' : '', c2 = m.s2 > m.s1 ? 'win' : '';
    const date = new Date(m.date).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    return `<li><span class="score"><span class="${c1}">${esc(m.p1)}</span> ${m.s1} – ${m.s2} <span class="${c2}">${esc(m.p2)}</span><br><span class="date">${date}</span></span>
      <button class="x" data-del-match="${i}" aria-label="Supprimer le match">✕</button></li>`;
  }).join('') : '<li class="muted">Aucun match pour l’instant.</li>';
}

$('addPlayer').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('playerName').value.trim();
  if (!name) return;
  if (state.players.some(p => p.toLowerCase() === name.toLowerCase())) { alert('Ce prénom existe déjà.'); return; }
  state.players.push(name);
  $('playerName').value = '';
  save(); render();
});

$('addMatch').addEventListener('submit', e => {
  e.preventDefault();
  const p1 = $('p1').value, p2 = $('p2').value;
  const s1 = parseInt($('s1').value, 10), s2 = parseInt($('s2').value, 10);
  const msg = $('matchMsg');
  if (!p1 || !p2) return msg.textContent = 'Ajoute d’abord deux joueurs.';
  if (p1 === p2) return msg.textContent = 'Choisis deux joueurs différents.';
  if (!(s1 >= 0) || !(s2 >= 0)) return msg.textContent = 'Score invalide.';
  msg.textContent = '';
  state.matches.push({ p1, p2, s1, s2, date: Date.now() });
  $('s1').value = 0; $('s2').value = 0;
  save(); render();
});

document.addEventListener('click', e => {
  const dp = e.target.closest('[data-del-player]');
  if (dp) {
    const name = state.players[+dp.dataset.delPlayer];
    const n = state.matches.filter(m => m.p1 === name || m.p2 === name).length;
    if (!confirm(`Supprimer ${name}${n ? ` et ses ${n} match(s)` : ''} ?`)) return;
    state.players = state.players.filter(p => p !== name);
    state.matches = state.matches.filter(m => m.p1 !== name && m.p2 !== name);
    save(); render();
  }
  const dm = e.target.closest('[data-del-match]');
  if (dm && confirm('Supprimer ce match ?')) {
    state.matches.splice(+dm.dataset.delMatch, 1);
    save(); render();
  }
});

$('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `fifa-compteur-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    if (!Array.isArray(s.players) || !Array.isArray(s.matches)) throw 0;
    if (!confirm('Remplacer les données actuelles par ce fichier ?')) return;
    state = s; save(); render();
  } catch (_) { alert('Fichier invalide.'); }
  e.target.value = '';
});
$('resetBtn').addEventListener('click', () => {
  if (confirm('Effacer tous les joueurs et tous les matchs ?')) { state = { players: [], matches: [] }; save(); render(); }
});

render();
</script>
</body>
</html>
